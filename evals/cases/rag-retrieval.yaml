# Retrieval eval (no model, SPEC 12 "Evals de RAG"): `dotnet run --project evals/Chatbot.Evals -- --retrieval`.
# Each question is searched with KnowledgeSearch in the knowledge base of its niche. `expectSources` are document slugs
# (file name without .md): the question passes when a chunk of one of them is in the top 4. The language pair
# (question language -> language of the expected document) is worked out from the documents, so es->en and en->es
# are the cross-language ones. `unanswerable: true` questions have no document: they only measure the relevance
# threshold (informational, not a pass/fail).

