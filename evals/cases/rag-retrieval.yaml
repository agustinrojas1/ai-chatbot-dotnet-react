# Retrieval eval (no model, SPEC 12 "Evals de RAG"): `dotnet run --project evals/Chatbot.Evals -- --retrieval`.
# Each question is searched with KnowledgeSearch in the knowledge base of its niche. `expectSources` are document slugs
# (file name without .md): the question passes when a chunk of one of them is in the top 4. The demo is English only, so
# every question and document is in English (en->en). `unanswerable: true` questions have no document: they only measure
# the relevance threshold (informational, not a pass/fail).

