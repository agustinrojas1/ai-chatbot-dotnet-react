    - anyOf: ["person", "human", "team", "someone", "advisor", "agent", "colleague"]
  # Only affirmative wordings: "I don't know whether our rentals include a garage" is a correct reply.
  forbidPhrases: ["yes, they include", "yes, our rentals include", "yes, rentals include", "all our rentals include", "garage is included", "free garage"]

