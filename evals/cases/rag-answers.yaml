# Knowledge base (RAG, M8) end to end: the agent must search the documents and answer only from them (SPEC 7.6, 12).
# The documents are in api/src/Chatbot.Infrastructure/Seeding/knowledge/<niche>/ and are indexed before these cases run.
# Some documents are in Spanish and some in English on purpose: a question in the other language tests the cross-language
# search AND the translation of the fact, so facts are checked as numbers and names (which survive translation), or with
# `anyOf` listing the translations.
# Every case also gets the default forbidden phrases (see Evaluator.DefaultForbiddenPhrases): never "confirmed".

# ---- rag_answer: the answer is in one document -------------------------------------------------------------------------

- id: rag-answer-dental-late-fee-en
  category: rag_answer
  niche: dental
  turns:
    - "How much is the fee if I cancel my appointment with less than 24 hours notice?"
  expectLanguage: en
  expectToolCalls: [{ name: search_knowledge_base }]
  expectRetrievalSources: [cancelacion-y-no-show]   # the Spanish document of the cancellation policy
  mustMention: ["$45"]
  forbidToolCalls: [create_booking]

