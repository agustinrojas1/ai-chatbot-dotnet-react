# ---- rag_unanswerable: no document has it. The agent says it has no information and offers a person; it invents nothing. ----
# The agent may search the knowledge base (and get found:false) or not: both are accepted. What is required is the admission and the offer.

- id: rag-unanswerable-dental-root-canal-en
  category: rag_unanswerable
  niche: dental
  turns:
    - say: "Do you offer root canal treatment? How much is it?"
      forbidToolCalls: [create_booking]
      mustMention:
        - anyOf: ["don't have", "do not have", "no information", "not sure", "couldn't find", "could not find", "can't confirm", "cannot confirm", "unable to", "not able to", "don't currently offer", "do not currently offer", "don't offer", "do not offer", "isn't something we", "is not something we", "not something we", "don't currently have", "doesn't appear", "not available"]
        - anyOf: ["person", "human", "team", "staff", "someone", "colleague", "receptionist"]
    - say: "Yes please, connect me with someone."
      expectToolCalls: [{ name: handoff_to_human }]
  expectLanguage: en
  expectHandoff: true
  forbidPhrases: ["root canal costs", "root canal treatment costs", "root canal is $", "root canals are $", "root canal starts at", "root canal from $", "yes, we offer root canal", "yes, we do root canal"]

- id: rag-unanswerable-realestate-parking-en
  category: rag_unanswerable
  niche: realestate
  turns:
    - "Do your rentals include a garage?"
  expectLanguage: en
