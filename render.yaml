# Render Blueprint for the API (docs/decisions.md, ADR-019). The free plan sleeps after 15 minutes without
# traffic; an uptime monitor on /health keeps it awake. Migrations and seed run from .github/workflows/ingest.yml.
services:
  - type: web
    name: ai-booking-agent-api
    runtime: docker
    plan: free
    region: virginia # next to Neon's aws-us-east-1
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: PORT # the Dockerfile listens on 8080
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres # Npgsql format: python3 deploy/neon-connection.py
        sync: false
      - key: Cors__AllowedOrigin
        value: https://booking-agent-demo.vercel.app,https://ai-booking-agent-six.vercel.app
      # Groq answers a tool round in about 0.5 s; Gemini's free tier took 5 to 10 s and returns 503 under load (ADR-020).
      # Groq's free tier allows 200K tokens a day and 8K a minute: past that it answers 429 and Gemini takes the call.
      - key: Llm__Primary__BaseUrl
        value: https://api.groq.com/openai/v1
      - key: Llm__Primary__Model
        value: openai/gpt-oss-120b
      - key: Llm__Primary__ApiKey # Groq key
        sync: false
      - key: Llm__Fallback__BaseUrl
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: Llm__Fallback__Model
        value: gemini-3.5-flash-lite
      - key: Llm__Fallback__ApiKey # Gemini key
        sync: false
      # Embeddings default to the primary provider, and Groq has none: they stay on Gemini.
      - key: Embeddings__BaseUrl
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: Embeddings__ApiKey # Gemini key, same as Llm__Fallback__ApiKey
        sync: false
      - key: Knowledge__AutoIngest
        value: "false"
      - key: Admin__Key
        generateValue: true
      - key: Admin__MaskPhones
        value: "true"
      - key: Security__IpHashSalt
        generateValue: true
